# JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Single-module app — parallel execution provides no benefit and can race on
# shared intermediate directories (incremental/packageDebug/tmp).
org.gradle.parallel=false

org.gradle.caching=false

# Windows: keep VFS watching off — the file watcher holds open handles on
# build-dir files which breaks Gradle's own incremental cleanup.
org.gradle.vfs.watch=false

kotlin.compiler.execution.strategy=in-process

# JDK: use JDK 17 (e.g. Android Studio's bundled JBR). Set JAVA_HOME, or add
# org.gradle.java.home=<path> to ~/.gradle/gradle.properties (NOT this file).

# Long-lived daemon: owns the relocated build dir for its whole lifetime, so it
# can cleanly delete its own incremental zip-cache between builds. A one-shot
# JVM (daemon=false) exits without guaranteeing Windows has released handles on
# the zip files it just wrote, so the next packageDebug fails with
# "Unable to delete directory .../packageDebug/tmp/debug/zip-cache".
# If you need `gradlew clean`, run `gradlew --stop` first so the daemon is gone.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000


# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.tooling.parallel=true
