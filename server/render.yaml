# Render Blueprint for the Event Management Hub backend (Express + Socket.IO + PostgreSQL).
# Full steps and caveats: server/docs/DEPLOY_RENDER.md. No secrets belong in this file.
#
# This file lives in server/, not at the repo root. When you create the Blueprint in the Render
# dashboard, set "Blueprint Path" to:  server/render.yaml
#
# COST: both resources below use the `free` plan so applying this Blueprint creates nothing billable.
# The free plans are for trying it out, not for production:
#   - free web service: sleeps after 15 minutes without traffic (about a minute to wake up)
#   - free PostgreSQL:  EXPIRES 30 days after creation (then a 14-day grace period, then it is deleted)
# To run it for real, change both `plan:` lines to a paid plan (see the guide) BEFORE the 30 days are up.
# Keep exactly ONE instance of the web service: Socket.IO state is in memory, and the free plan cannot scale out.

services:
  - type: web
    name: emh-server
    runtime: node
    rootDir: server                  # build/start commands run inside server/; nothing outside it is visible
    branch: server                   # change to the branch you deploy from (for example main after merging)
    region: frankfurt                # Render has no London/UK region; Frankfurt (Germany) is the nearest listed to the UK.
                                     # Must equal the database region (the internal URL only works inside one region);
                                     # a region cannot be changed after creation, so decide before the first apply.
    plan: free
    buildCommand: npm ci --omit=dev  # production dependencies only; the dev-only embedded PostgreSQL is not installed
    startCommand: npm start          # node src/server.js: Express + Socket.IO on $PORT (Render sets PORT, default 10000)
    healthCheckPath: /ping           # 2xx = healthy; it also runs a database query
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL            # the database's INTERNAL connection string, injected by Render; never typed or committed
        fromDatabase:
          name: emh-db
          property: connectionString
      - key: JWT_SECRET              # random 256-bit value generated by Render once; stays stable across deploys
        generateValue: true
      - key: MIGRATE_ON_BOOT         # migrations are run on purpose (npm run db:migrate), not on every restart
        value: "false"
      # Optional, add in the dashboard when needed (not declared here so the Blueprint does not prompt for it):
      #   CORS_ORIGINS   comma-separated exact origins of a browser front end (empty = no browser access; Android is unaffected)
      #   JWT_EXPIRES_IN (default 7d)   BCRYPT_ROUNDS (default 10)

databases:
  - name: emh-db
    plan: free                       # EXPIRES after 30 days; see the note at the top of this file
    databaseName: emh
    user: emh
    region: frankfurt                # MUST equal the web service region (Frankfurt)
    # ipAllowList omitted: external access is open to any IP but still needs the credentials, which is what lets you
    # run `npm run db:migrate` from your own machine. Restrict it (add your IP) once you have run the migration.
